# dokploy: allow-host-ports — mail protocols are not HTTP; mail servers and clients must reach them directly on the host.
version: "3.8"
services:
  mailserver:
    image: analogic/poste.io:latest
    restart: unless-stopped
    hostname: mail.${DOMAIN}
    ports:
      - "25:25"      # SMTP
      - "110:110"    # POP3
      - "143:143"    # IMAP
      - "465:465"    # SMTPS
      - "587:587"    # Submission
      - "993:993"    # IMAPS
      - "995:995"    # POP3S
      - "4190:4190"  # Sieve
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}" # Web UI & Webmail (Admin Access)
    environment:
      - TZ=${TZ}
      - HTTPS=OFF
      - HTTP_PORT=${HTTP_PORT:-8080}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - poste-data:/data

volumes:
  poste-data: {}
